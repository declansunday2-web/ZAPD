function closeInventory(){if(mode!=='inventory')return;inventoryAnimationRun++;mode='game';overlay.classList.remove('inventory-overlay');hideOverlay();lastFrame=0;requestAnimationFrame(loop)}
function openItemActions(itemId,fromHand=false){const item=fromHand?equippedHand:inventoryItems.find(entry=>entry.id===itemId);if(!item)return;const panel=document.createElement('div');panel.className='item-action-backdrop';panel.innerHTML=`<div class="item-action-panel"><div class="item-action-title">${item.name}</div><div class="item-action-desc">${item.type==='gun'?(fromHand?'EQUIPPED IN HAND':'READY TO EQUIP'):item.type==='ammo'?`PACK OF ${AMMO_PACK} ROUNDS`:'RESTORES 1 HEART'}</div><div class="item-action-buttons">${item.type==='gun'?`<button class="item-action-button" data-action="${fromHand?'unequip':'equip'}">${fromHand?'UNEQUIP':'EQUIP'}</button>`:`<button class="item-action-button" data-action="use">USE</button>`}<button class="item-action-button" data-action="drop">DROP</button></div><button class="item-action-cancel">CANCEL</button></div>`;overlay.querySelector('.inventory-shell').append(panel);panel.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>performItemAction(item.id,fromHand,button.dataset.action)));panel.querySelector('.item-action-cancel').addEventListener('click',()=>panel.remove())}
function performItemAction(itemId,fromHand,action){const item=fromHand?equippedHand:inventoryItems.find(entry=>entry.id===itemId);if(!item)return;const removeFromBag=()=>{const index=inventoryItems.findIndex(entry=>entry.id===itemId);if(index>=0)inventoryItems.splice(index,1)};inventoryNotice='';if(action==='equip'&&item.type==='gun'&&!fromHand){removeFromBag();if(equippedHand)inventoryItems.push(equippedHand);equippedHand=item;hasGun=true;canvas.style.cursor='none';inventoryNotice='GUN EQUIPPED'}else if(action==='unequip'&&item.type==='gun'&&fromHand){if(inventoryItems.length>=36){inventoryNotice='MISC ITEMS ARE FULL';renderInventory();return}inventoryItems.push(item);equippedHand=null;hasGun=false;canvas.style.cursor='default';inventoryNotice='GUN MOVED TO MISC ITEMS'}else if(action==='drop'){if(fromHand){equippedHand=null;hasGun=false;canvas.style.cursor='default'}else removeFromBag();inventoryNotice=`${item.name} DROPPED`}else if(action==='use'&&item.type==='heart'){if(health>=MAX_HEALTH){inventoryNotice='HEALTH IS ALREADY FULL';renderInventory();return}health=Math.min(MAX_HEALTH,health+1);removeFromBag();inventoryNotice='HEART USED · +1 HEALTH'}else if(action==='use'&&item.type==='ammo'){if(ammo>=MAX_AMMO){inventoryNotice='AMMO IS ALREADY FULL';renderInventory();return}ammo=Math.min(MAX_AMMO,ammo+AMMO_PACK);removeFromBag();inventoryNotice=`AMMO LOADED · ${ammo} ROUNDS`}renderInventory()}
function buyShopItem(item){if(inventoryItems.length>=36){shopMessage='MISC ITEMS FULL · MAKE ROOM FIRST';renderShopMenu();return}if(item==='gun'){if(ownsGun()||money<GUN_PRICE)return;money-=GUN_PRICE;inventoryItems.push({id:nextInventoryItemId++,type:'gun',name:'GUN'});if(ammo===0)ammo=25;shopMessage='Gun added to misc items. It comes with 25 rounds.'}else if(item==='ammo'){if(!ownsGun()||money<AMMO_PRICE)return;money-=AMMO_PRICE;inventoryItems.push({id:nextInventoryItemId++,type:'ammo',name:'AMMO PACK'});shopMessage='Ammo pack added to your misc items.'}else if(item==='heal'){if(money<50)return;money-=50;inventoryItems.push({id:nextInventoryItemId++,type:'heart',name:'HEART REGEN'});shopMessage='Heart regen added to your misc items.'}renderShopMenu()}
function interact(){if(mode!=='game')return;if(insideWeaponShop){if(nearWeaponShopDoor())leaveWeaponShop();else if(nearShopkeeper())openShop();else{notice='WALK UP TO THE COUNTER TO TALK';noticeTimer=90}return}if(insidePizzeria){if(nearInteriorDoor())leavePizzeria();else if(nearInteriorPizza())pickUpPizzaInside();return}if(nearWeaponShop()){enterWeaponShop();return}if(nearShop()){enterPizzeria();return}const target=currentTarget();if(!pizzaLoaded){notice='GET A HOT PIZZA AT ZOMBINO\'S';noticeTimer=120;return}if(nearDelivery(target)){money+=40;score+=100;pizzaLoaded=false;timeLeft=0;deliveries++;playDeliveryDing();addDeliveryWave();notice='DELIVERED HOT · +$40 · MORE ZOMBIES INCOMING';noticeTimer=120;if(deliveries>=deliveryTargets.length){endGame(true)}return}notice='FOLLOW THE ARROW TO YOUR CUSTOMER';noticeTimer=100}
function endGame(won){mode='result';drawStreet();overlay.style.background='#030406f8';overlayBox(`<div class="panel"><div class="logo">${won?'Z.A.P.D.':'YOU DIED'}</div><div class="sub">${won?'All pizzas delivered, end of demo.':'The courier has fallen.'}</div><button class="pixel-btn" id="again">${won?'PLAY AGAIN':'TRY AGAIN'} ▶</button></div>`);document.getElementById('again').onclick=startGame}
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();aimPointer={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};aim={x:aimPointer.x+camera.x,y:aimPointer.y+camera.y};pointerInside=true});canvas.addEventListener('pointerleave',()=>{pointerInside=false;canvas.style.cursor='default'});canvas.addEventListener('pointerenter',()=>{if(hasGun)canvas.style.cursor='none'});
canvas.addEventListener('click',e=>{if(mode!=='game'||insidePizzeria)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width+camera.x,y=(e.clientY-r.top)*H/r.height+camera.y;if(x>=weaponShop.x-6&&x<=weaponShop.x+weaponShop.w+6&&y>=weaponShop.y-8&&y<=weaponShop.y+weaponShop.h+2)enterWeaponShop()});
document.addEventListener('keydown',e=>{if(mode==='inventory'){if(e.key==='Escape'||e.key==='Tab'){e.preventDefault();closeInventory()}return}if(mode==='settings'){if(e.key==='Escape'){e.preventDefault();closeSettings()}return}if(mode==='paused'){if(e.key==='Escape'){e.preventDefault();closePauseMenu()}return}if(mode==='shopDialogue'){if(e.key==='Escape'){e.preventDefault();cancelShopDialogue()}else if(e.key==='Enter'||e.key===' '||e.key==='e'||e.key==='E'){e.preventDefault();advanceShopkeeperDialogue()}return}if(mode==='shop'){if(e.key==='Escape'||e.key==='e'||e.key==='E')closeShop();return}if(mode==='game'&&e.key==='Escape'){e.preventDefault();openPauseMenu();return}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Tab'].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key==='m'||e.key==='M'){toggleAudio()}else if(mode==='cutscene'&&(e.key==='Enter'||e.key===' ')){nextDialog()}else if(mode==='game'&&e.key==='Tab'){openInventory()}else if(mode==='game'&&e.key===' '){shoot()}else if(mode==='game'&&(e.key==='e'||e.key==='E')){interact()}else if(mode==='title'&&e.key==='Enter')showStart()});document.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();keys[k==='Space'?' ':k]=true;if(k==='Space')shoot()};const up=e=>{e.preventDefault();keys[k==='Space'?' ':k]=false};b.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,up))});
document.getElementById('interactTouch').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
showTitle();
})();
</script>
