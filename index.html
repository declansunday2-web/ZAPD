<body>
<main class="wrap">
<div class="cabinet"><div class="screen" id="screen"><canvas id="game" width="384" height="216" aria-label="Z.A.P.D. pixel art game"></canvas><div class="overlay" id="overlay"></div></div><div class="hint"><span><b>WASD</b> MOVE &nbsp; <b>TAB</b> INVENTORY &nbsp; <b>E / CLICK</b> SHOP &nbsp; <b>SPACE</b> SHOOT / PUNCH</span><button class="audio-toggle" id="audioToggle" type="button">MUSIC: OFF · M TOGGLE</button></div></div>

<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');ctx.imageSmoothingEnabled=false;
const musicAudio=new Audio('assets/background-music.mp3');musicAudio.loop=true;musicAudio.volume=.22;
const typingAudio=new Audio('assets/typing.mp3');typingAudio.preload='auto';typingAudio.volume=.5;typingAudio.load();const typingBlips=new Set();
const engineSfx=new Audio('assets/engine-sfx.mp3');engineSfx.preload='auto';engineSfx.volume=.34;
let sfxContext=null;
const art={playerIdle:new Image(),playerWalk:new Image(),playerShoot:new Image(),bullet:new Image(),zombieWalk:new Image(),opening:new Image(),office:new Image(),marker:new Image(),fist:new Image(),boss:new Image(),tiles:new Image(),pizzeria:new Image(),shop:new Image()};
art.playerIdle.src='assets/player-idle.png';art.playerWalk.src='assets/player-walk.png';art.zombieWalk.src='assets/zombie-walk.png';art.opening.src='assets/scene-opening.jpeg';art.office.src='assets/scene-office.jpeg';art.marker.src='assets/scene-marker.jpeg';art.fist.src='assets/scene-fist.jpeg';art.boss.src='assets/scene-boss.jpeg';art.tiles.src='assets/suburban-atlas.png';art.pizzeria.src='assets/pizzeria.png';
art.playerShoot.src='assets/player-shoot.png';art.bullet.src='assets/bullet.png';
art.shop.src='assets/shop-building.png';
const W=384,H=216,WORLD_W=W*2,WORLD_H=H*2,MAX_HEALTH=3,DISTRICT_W=W,DISTRICT_H=H,DELIVERY_SECONDS=20,MAX_ZOMBIES=24,BASE_ZOMBIES=6, keys={}, C={night:'#08090b',road:'#29323a',road2:'#35404a',grass:'#24352c',grass2:'#2d4234',cream:'#ded6c2',gold:'#cc9a50',red:'#c24c40',green:'#758252',blue:'#667e87'};
const districtNames=['NORTHWEST','NORTHEAST','SOUTHWEST','SOUTHEAST'];
const pizzeria={x:27,y:20,w:68,h:68};
const houseFrames=[[10,20,280,310],[305,23,250,306],[555,23,245,306],[803,24,210,303],[1020,20,250,310],[1265,39,255,282]];
const weaponShop={x:91,y:149,w:61,h:60},GUN_PRICE=250,AMMO_PRICE=25,AMMO_PACK=25,MAX_AMMO=100;
let mode='start',playerName='',dialogIndex=0,charIndex=0,lastType=0,typeTimer=0,openingSlide=false,boardBeat=false,worldTick=0,deliveries=0,health=MAX_HEALTH,money=100,score=0,zombies=[],houses=[],deliveryTargets=[],player={x:108,y:55,face:'down'},playerMoving=false,camera={x:0,y:0},pizzaLoaded=false,timeLeft=0,lastFrame=0,invuln=0,punchTimer=0,punchCooldown=0,notice='',noticeTimer=0,zombieSpawnTimer=0,deathTimer=0,hasGun=false,ammo=0,bullets=[],shotCooldown=0,aim={x:192,y:108},aimPointer={x:192,y:108},pointerInside=false,inventoryItems=[],equippedHand=null,nextInventoryItemId=1,inventoryAnimationRun=0,inventoryNotice='';
const lines=[['BOSS:',()=>`The world of pizza is ending, ${playerName}.`],['BOSS:',()=>'We cannot let this stop us.'],['BOSS:',()=>'Are you in?']];
const boardLine='Not Bombinos anymore, Zombinos.';
const openingLine='Zombies have taken over, and the other wimpy pizzerias have quit, but not us.';
function toggleAudio(){if(musicAudio.paused){musicAudio.play().then(setAudioLabel).catch(setAudioLabel)}else{musicAudio.pause();setAudioLabel()}}
function setAudioLabel(){document.getElementById('audioToggle').textContent=`MUSIC: ${musicAudio.paused?'OFF':'ON'} · M TOGGLE`}
document.getElementById('audioToggle').addEventListener('click',toggleAudio);
function primeTypingAudio(){const volume=typingAudio.volume;typingAudio.volume=0;typingAudio.currentTime=0;typingAudio.play().then(()=>{typingAudio.pause();typingAudio.currentTime=0;typingAudio.volume=volume}).catch(()=>{typingAudio.volume=volume})}
function typeBlip(char){if(!char||char===' ')return;const blip=typingAudio.cloneNode();blip.volume=.42;blip.currentTime=0;typingBlips.add(blip);blip.play().then(()=>setTimeout(()=>{blip.pause();blip.currentTime=0;typingBlips.delete(blip)},110)).catch(()=>typingBlips.delete(blip))}
function stopTypingAudio(){typingBlips.forEach(blip=>{blip.pause();blip.currentTime=0});typingBlips.clear();typingAudio.pause();typingAudio.currentTime=0}
function playEngineSfx(){engineSfx.pause();engineSfx.currentTime=0;engineSfx.play().catch(()=>{})}
function playDeliveryDing(){try{const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;sfxContext??=new AudioContextClass();if(sfxContext.state==='suspended')sfxContext.resume();const now=sfxContext.currentTime;[[880,0],[1174,.07],[1568,.14]].forEach(([hz,delay])=>{const osc=sfxContext.createOscillator(),gain=sfxContext.createGain(),start=now+delay;osc.type='sine';osc.frequency.setValueAtTime(hz,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.16,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+.34);osc.connect(gain);gain.connect(sfxContext.destination);osc.start(start);osc.stop(start+.35)})}catch{}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawHeart(x,y,filled){const shape=['1100110','1111111','1111111','0111110','0011100','0001000'];shape.forEach((r,dy)=>[...r].forEach((bit,dx)=>{if(bit==='1')rect(x+dx,y+dy,1,1,filled?C.red:'#59414a')}))}
function text(s,x,y,size=8,color=C.cream,align='left'){ctx.fillStyle=color;ctx.font=`${size}px "Press Start 2P",monospace`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function overlayBox(html){overlay.innerHTML=html;overlay.style.display='grid'}
function hideOverlay(){overlay.style.display='none'}
function startFromName(){const input=document.getElementById('name');playerName=(input?.value||'').trim().slice(0,14)||'Rookie';mode='cutscene';dialogIndex=0;charIndex=0;openingSlide=true;boardBeat=false;lastType=0;hideOverlay();musicAudio.play().then(setAudioLabel).catch(setAudioLabel);primeTypingAudio();drawCutscene()}
function showStart(){mode='start';buildMap();camera={x:0,y:0};drawStartBG();overlayBox(`<div class="panel"><div class="logo">Z.A.P.D.</div><div class="sub">ZOMBIE APOCALYPSE<br>PIZZA DELIVERY</div><label class="field-label" for="name">YOUR NAME</label><input class="name-input" id="name" maxlength="14" autocomplete="off" placeholder="DELIVERY RUNNER"/><button class="pixel-btn" id="begin">START ▶</button></div>`);document.getElementById('begin').onclick=startFromName;document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')startFromName()});document.getElementById('name').focus()}
function drawStartBG(){drawStreet(true);text('PRESS START',192,188,8,C.gold,'center')}
function drawCutscene(){
  rect(0,0,W,H,'#10151c');const scene=openingSlide?art.opening:boardBeat?art.marker:dialogIndex===0?art.office:dialogIndex===1?art.fist:art.boss;if(scene.complete&&scene.naturalWidth){if(scene===art.office){const scale=Math.min(W/scene.naturalWidth,H/scene.naturalHeight),dw=scene.naturalWidth*scale,dh=scene.naturalHeight*scale;ctx.drawImage(scene,(W-dw)/2,(H-dh)/2,dw,dh)}else ctx.drawImage(scene,0,0,W,H)}else{rect(0,0,W,H,'#20242c');text('ZOMBINO\'S PIZZA HQ',W/2,96,9,C.gold,'center')}rect(0,0,W,H,'#080b1080');
  rect(10,157,364,49,'#090c12e8');rect(12,159,360,45,'#1a2027e8');text('BOSS:',23,176,7,C.gold);const full=openingSlide?openingLine:boardBeat?boardLine:lines[dialogIndex][1]();const shown=full.slice(0,charIndex);ctx.font=`${openingSlide?7:8}px "Press Start 2P",monospace`;ctx.fillStyle=C.cream;ctx.textAlign='left';wrapText(shown,23,190,337,11);text('▼',357,199,6,C.gold,'center');if(mode==='cutscene'&&charIndex<full.length&&!typeTimer)typeTimer=setTimeout(()=>{typeTimer=0;typeBlip(full.charAt(charIndex));charIndex++;drawCutscene()},60);
}
function wrapText(str,x,y,maxWidth,lineH){const words=str.split(' ');let line='';for(const word of words){let test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=word;y+=lineH}else line=test}if(line)ctx.fillText(line,x,y)}
function nextDialog(){if(mode!=='cutscene')return;const full=openingSlide?openingLine:boardBeat?boardLine:lines[dialogIndex][1]();if(charIndex<full.length){clearTimeout(typeTimer);typeTimer=0;stopTypingAudio();charIndex=full.length;drawCutscene();return}clearTimeout(typeTimer);typeTimer=0;stopTypingAudio();if(openingSlide){openingSlide=false;dialogIndex=0;charIndex=0;drawCutscene()}else if(boardBeat){boardBeat=false;dialogIndex=2;charIndex=0;drawCutscene()}else if(dialogIndex===1){boardBeat=true;charIndex=0;drawCutscene()}else if(dialogIndex<lines.length-1){dialogIndex++;charIndex=0;drawCutscene()}else showTitle()}
function showTitle(){mode='title';camera={x:0,y:0};zombies=[{x:212,y:108,baseX:212,baseY:108,face:'left'},{x:339,y:176,baseX:339,baseY:176,face:'up'},{x:175,y:202,baseX:175,baseY:202,face:'right'}];worldTick=0;drawStreet();overlay.style.background='#020306df';overlayBox(`<div class="panel"><div class="logo">Z.A.P.D.</div><div class="sub">ZOMBIE APOCALYPSE<br>PIZZA DELIVERY</div><div class="small">8 PIZZAS · 20 SECONDS EACH</div><button class="pixel-btn" id="ride">START ▶</button></div>`);document.getElementById('ride').onclick=startGame;requestAnimationFrame(titleLoop)}
function titleLoop(){if(mode!=='title')return;worldTick++;zombies.forEach((z,i)=>{z.x=z.baseX+Math.sin(worldTick/37+i*2)*5;z.y=z.baseY+Math.cos(worldTick/48+i*2)*2});drawStreet();ctx.save();ctx.translate(-camera.x,-camera.y);zombies.forEach(drawZombie);ctx.restore();requestAnimationFrame(titleLoop)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function atlasDraw(sx,sy,sw,sh,dx,dy,dw,dh){if(art.tiles.complete&&art.tiles.naturalWidth)ctx.drawImage(art.tiles,sx,sy,sw,sh,dx,dy,dw,dh)}
function drawRoadTile(x,y,vertical=false){ctx.save();if(vertical){ctx.translate(x+22.5,y+21);ctx.rotate(Math.PI/2);atlasDraw(13,342,120,130,-21,-22.5,42,45)}else atlasDraw(13,342,120,130,x,y,42,45);ctx.restore()}

function drawStreet(){ctx.fillStyle='#111a14';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-camera.x,-camera.y);rect(0,0,WORLD_W,WORLD_H,'#192a25');
  if(art.tiles.complete&&art.tiles.naturalWidth){const grass=[[14,578],[110,578],[214,578],[314,578],[14,673],[110,673],[214,673],[314,673]];let n=0;for(let y=0;y<WORLD_H;y+=41)for(let x=0;x<WORLD_W;x+=43){const [sx,sy]=grass[(n++)%grass.length];atlasDraw(sx,sy,86,82,x,y,43,41)}for(const x of [166,550])for(let y=0;y<WORLD_H;y+=42)drawRoadTile(x,y,true);for(const y of [87,303])for(let x=0;x<WORLD_W;x+=42)drawRoadTile(x,y);for(const y of [73,132,289,348])for(let x=0;x<WORLD_W;x+=38)drawSidewalkTile(x,y);for(const x of [152,211,536,595])for(let y=0;y<WORLD_H;y+=38)drawSidewalkTile(x,y,true)}else{for(const x of [166,550])rect(x,0,45,WORLD_H,'#323a41');for(const y of [87,303])rect(0,y,WORLD_W,45,'#323a41')}

function openItemActions(itemId,fromHand=false){const item=fromHand?equippedHand:inventoryItems.find(entry=>entry.id===itemId);if(!item)return;const panel=document.createElement('div');panel.className='item-action-backdrop';panel.innerHTML=`<div class="item-action-panel"><div class="item-action-title">${item.name}</div><div class="item-action-desc">${item.type==='gun'?(fromHand?'EQUIPPED IN HAND':'READY TO EQUIP'):item.type==='ammo'?`PACK OF ${AMMO_PACK} ROUNDS`:'RESTORES 1 HEART'}</div><div class="item-action-buttons">${item.type==='gun'?`<button class="item-action-button" data-action="${fromHand?'unequip':'equip'}">${fromHand?'UNEQUIP':'EQUIP'}</button>`:`<button class="item-action-button" data-action="use">USE</button>`}<button class="item-action-button" data-action="drop">DROP</button></div><button class="item-action-cancel">CANCEL</button></div>`;overlay.querySelector('.inventory-shell').append(panel);panel.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>performItemAction(item.id,fromHand,button.dataset.action)));panel.querySelector('.item-action-cancel').addEventListener('click',()=>panel.remove())}
function performItemAction(itemId,fromHand,action){const item=fromHand?equippedHand:inventoryItems.find(entry=>entry.id===itemId);if(!item)return;const removeFromBag=()=>{const index=inventoryItems.findIndex(entry=>entry.id===itemId);if(index>=0)inventoryItems.splice(index,1)};inventoryNotice='';if(action==='equip'&&item.type==='gun'&&!fromHand){removeFromBag();if(equippedHand)inventoryItems.push(equippedHand);equippedHand=item;hasGun=true;canvas.style.cursor='none';inventoryNotice='GUN EQUIPPED'}else if(action==='unequip'&&item.type==='gun'&&fromHand){if(inventoryItems.length>=36){inventoryNotice='MISC ITEMS ARE FULL';renderInventory();return}inventoryItems.push(item);equippedHand=null;hasGun=false;canvas.style.cursor='default';inventoryNotice='GUN MOVED TO MISC ITEMS'}else if(action==='drop'){if(fromHand){equippedHand=null;hasGun=false;canvas.style.cursor='default'}else removeFromBag();inventoryNotice=`${item.name} DROPPED`}else if(action==='use'&&item.type==='heart'){if(health>=MAX_HEALTH){inventoryNotice='HEALTH IS ALREADY FULL';renderInventory();return}health=Math.min(MAX_HEALTH,health+1);removeFromBag();inventoryNotice='HEART USED · +1 HEALTH'}else if(action==='use'&&item.type==='ammo'){if(ammo>=MAX_AMMO){inventoryNotice='AMMO IS ALREADY FULL';renderInventory();return}ammo=Math.min(MAX_AMMO,ammo+AMMO_PACK);removeFromBag();inventoryNotice=`AMMO LOADED · ${ammo} ROUNDS`}renderInventory()}
function buyShopItem(item){if(inventoryItems.length>=36){shopMessage='MISC ITEMS FULL · MAKE ROOM FIRST';renderShopMenu();return}if(item==='gun'){if(ownsGun()||money<GUN_PRICE)return;money-=GUN_PRICE;inventoryItems.push({id:nextInventoryItemId++,type:'gun',name:'GUN'});if(ammo===0)ammo=25;shopMessage='Gun added to misc items. It comes with 25 rounds.'}else if(item==='ammo'){if(!ownsGun()||money<AMMO_PRICE)return;money-=AMMO_PRICE;inventoryItems.push({id:nextInventoryItemId++,type:'ammo',name:'AMMO PACK'});shopMessage='Ammo pack added to your misc items.'}else if(item==='heal'){if(money<50)return;money-=50;inventoryItems.push({id:nextInventoryItemId++,type:'heart',name:'HEART REGEN'});shopMessage='Heart regen added to your misc items.'}renderShopMenu()}
function interact(){if(mode!=='game')return;if(nearWeaponShop()){openShop();return}if(nearShop()){if(pizzaLoaded){notice='PIE ALREADY IN YOUR BAG';noticeTimer=100;return}pizzaLoaded=true;timeLeft=DELIVERY_SECONDS;playEngineSfx();notice='HOT PIE LOADED · 20 SECONDS';noticeTimer=120;return}const target=currentTarget();if(!pizzaLoaded){notice='GET A HOT PIZZA AT ZOMBINO\'S';noticeTimer=120;return}if(nearDelivery(target)){money+=40;score+=100;pizzaLoaded=false;timeLeft=0;deliveries++;playDeliveryDing();addDeliveryWave();notice='DELIVERED HOT · +$40 · MORE ZOMBIES INCOMING';noticeTimer=120;if(deliveries>=deliveryTargets.length){endGame(true)}return}notice='FOLLOW THE ARROW TO YOUR CUSTOMER';noticeTimer=100}
function endGame(won){mode='result';drawStreet();overlay.style.background='#030406f8';overlayBox(`<div class="panel"><div class="logo">${won?'Z.A.P.D.':'YOU DIED'}</div><div class="sub">${won?'All pizzas delivered, end of demo.':'The courier has fallen.'}</div><button class="pixel-btn" id="again">${won?'PLAY AGAIN':'TRY AGAIN'} ▶</button></div>`);document.getElementById('again').onclick=startGame}
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();aimPointer={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};aim={x:aimPointer.x+camera.x,y:aimPointer.y+camera.y};pointerInside=true});canvas.addEventListener('pointerleave',()=>{pointerInside=false;canvas.style.cursor='default'});canvas.addEventListener('pointerenter',()=>{if(hasGun)canvas.style.cursor='none'});
canvas.addEventListener('click',e=>{if(mode!=='game')return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width+camera.x,y=(e.clientY-r.top)*H/r.height+camera.y;if(x>=weaponShop.x-6&&x<=weaponShop.x+weaponShop.w+6&&y>=weaponShop.y-8&&y<=weaponShop.y+weaponShop.h+2)openShop()});
document.addEventListener('keydown',e=>{if(mode==='inventory'){if(e.key==='Escape'||e.key==='Tab'){e.preventDefault();closeInventory()}return}if(mode==='shop'){if(e.key==='Escape'||e.key==='e'||e.key==='E')closeShop();return}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Tab'].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key==='m'||e.key==='M'){toggleAudio()}else if(mode==='cutscene'&&(e.key==='Enter'||e.key===' ')){nextDialog()}else if(mode==='game'&&e.key==='Tab'){openInventory()}else if(mode==='game'&&e.key===' '){shoot()}else if(mode==='game'&&(e.key==='e'||e.key==='E')){interact()}else if(mode==='title'&&e.key==='Enter')startGame()});document.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();keys[k==='Space'?' ':k]=true;if(k==='Space')shoot()};const up=e=>{e.preventDefault();keys[k==='Space'?' ':k]=false};b.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,up))});
document.getElementById('interactTouch').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
showStart();
})();
</script>
</body>
